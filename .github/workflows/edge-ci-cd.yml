name: Edge CI/CD

on:
  pull_request:
  push:
    branches:
      - dev
      - dev-v01
      - release
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Device that receives the tested release commit
        required: true
        type: choice
        default: pi
        options:
          - pi
          - jetson
          - both
          - none

permissions:
  contents: read

jobs:
  test:
    name: Test locked codebase
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      deploy_target: ${{ steps.deploy-target.outputs.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development dependencies
        run: uv sync --locked --group dev

      - name: Validate shell deployment scripts
        run: bash -n scripts/edge_start_backend.sh scripts/bootstrap_edge_host.sh scripts/deploy_edge_release.sh

      - name: Run repository tests
        run: uv run --no-sync pytest -q

      - name: Resolve and validate release deployment target
        id: deploy-target
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TARGET: ${{ inputs.deploy_target }}
          RELEASE_TARGET: ${{ vars.EVONITH_DEPLOY_TARGET }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            target="${MANUAL_TARGET:-pi}"
          else
            target="${RELEASE_TARGET:-pi}"
          fi
          case "$target" in
            pi|jetson|both|none) ;;
            *) echo "Invalid deployment target: $target" >&2; exit 1 ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Resolved deployment target: $target"

  deploy-jetson:
    name: Deploy Jetson
    needs: test
    if: >-
      ${{
        github.ref == 'refs/heads/release' &&
        (needs.test.outputs.deploy_target == 'jetson' || needs.test.outputs.deploy_target == 'both')
      }}
    runs-on: [self-hosted, linux, ARM64, evonith-jetson]
    environment: jetson-production
    timeout-minutes: 30
    concurrency:
      group: evonith-jetson-production
      cancel-in-progress: false
    steps:
      - name: Check out tested source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Deploy exact tested commit
        run: >-
          scripts/deploy_edge_release.sh
          --ref "${GITHUB_SHA}"
          --branch release
          --device jetson

  deploy-raspberry-pi:
    name: Deploy Raspberry Pi
    needs: test
    if: >-
      ${{
        github.ref == 'refs/heads/release' &&
        (needs.test.outputs.deploy_target == 'pi' || needs.test.outputs.deploy_target == 'both')
      }}
    runs-on: [self-hosted, linux, ARM64, evonith-pi]
    environment: raspberry-pi-production
    timeout-minutes: 30
    concurrency:
      group: evonith-raspberry-pi-production
      cancel-in-progress: false
    steps:
      - name: Check out tested source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Deploy exact tested commit
        run: >-
          scripts/deploy_edge_release.sh
          --ref "${GITHUB_SHA}"
          --branch release
          --device raspberry-pi
