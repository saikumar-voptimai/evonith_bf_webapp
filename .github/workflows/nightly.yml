# Nightly full test suite (programme #262, SV-0.11 #280): the CI workflow with the slow production cases of the burden
# engine (BURDEN_ENGINE_FAST unset), plus the static and frontend checks. GitHub runs scheduled workflows from the
# default branch only; workflow_dispatch starts a run on any branch.
name: Nightly

on:
  schedule:
    - cron: "17 21 * * *" # 02:47 IST, before the A shift report (06:00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI (full suite)
    uses: ./.github/workflows/ci.yml
    with:
      full-suite: true
