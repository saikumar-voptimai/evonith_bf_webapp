# Nightly full test suite (programme #262, SV-0.11 #280): the CI workflow with the slow production cases of the burden
# engine (BURDEN_ENGINE_FAST unset), plus the static and frontend checks. Manual runs only (user decision 29 Oct 2026,
# to save GitHub Actions minutes): the nightly schedule is off; workflow_dispatch starts a run on any branch.
name: Nightly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI (full suite)
    uses: ./.github/workflows/ci.yml
    with:
      full-suite: true
