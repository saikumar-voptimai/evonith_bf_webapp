# Checks of the BF-02 webapp (programme #262, SV-0.11 #280).
#
#   static          Ruff on the programme's Python; uv.lock in step with pyproject.toml and installable on the
#                   Jetson (linux-aarch64, glibc 2.35, CPython 3.12): `make lint-py`, `make lock-check`
#   python-tests    pytest with PostgreSQL (service container), Redis and Caddy; a missing service fails the run
#                   (BF_TEST_REQUIRE_SERVICES=1). The OpenAPI schema and the chart / page fixtures are checked
#                   against the code by the suite itself (tests/test_api_foundation.py, test_chart_fixtures.py,
#                   test_legacy_pages.py).
#   frontend        Prettier and ESLint, svelte-check, Vitest, the TypeScript client against the committed OpenAPI
#                   schema, the static build and the UI audit (axe-core, layout, keyboard; Playwright Chromium)
#
# Pull requests and pushes run the fast suite (BURDEN_ENGINE_FAST=1: the production cases of the burden engine,
# 10-50 s each, are skipped). nightly.yml calls this workflow with full-suite: true; release.yml calls it before it
# publishes the release artefacts. Action versions are pinned to commits (tag in the comment). The command steps run
# through scripts/ci/step.sh, which repeats the end of a failing step's output as an error annotation.
name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:
    inputs:
      full-suite:
        description: Include the slow production cases of the burden engine (BURDEN_ENGINE_FAST unset)
        type: boolean
        default: false
  workflow_call:
    inputs:
      full-suite:
        description: Include the slow production cases of the burden engine (BURDEN_ENGINE_FAST unset)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/') }}

env:
  UV_VERSION: "0.7.13" # lock rule (CLAUDE.md): uv.lock stays at revision 2
  UV_PYTHON_PREFERENCE: only-managed # CPython 3.12 from uv (.python-version), as on the Jetson (SV-6.2)
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.0"
  CADDY_VERSION: "2.10.2"
  # SHA-512 of caddy_2.10.2_linux_amd64.tar.gz, from caddy_2.10.2_checksums.txt of the release
  CADDY_SHA512: 747df7ee74de188485157a383633a1a963fd9233b71fbb4a69ddcbcc589ce4e2cc82dacf5dbbe136cb51d17e14c59daeb5d9bc92487610b0f3b93680b2646546

jobs:
  static:
    name: Ruff and lock files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Ruff (check, format; version and paths in the Makefile)
        run: bash scripts/ci/step.sh "Ruff" make lint-py
      - name: uv.lock matches pyproject.toml and installs on the Jetson
        run: bash scripts/ci/step.sh "Lock check" make lock-check UV_LOCK=uv

  python-tests:
    name: pytest${{ inputs.full-suite && ' (full suite)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full-suite && 90 || 30 }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BURDEN_ENGINE_FAST: ${{ inputs.full-suite && '0' || '1' }}
      BF_TEST_REQUIRE_SERVICES: "1"
      BF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true # keep only wheels built from source; PyPI wheels (torch 2.8 GB) download faster than a restore
          cache-python: true
      - name: Redis server (tests of the event stream and the job queue)
        run: |
          sudo rm -f /var/lib/man-db/auto-update # skip the man-db trigger of apt (tens of seconds on the runners)
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends redis-server
          redis-server --version
      - name: Caddy (tests of the Jetson's Caddyfile)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/caddy.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          echo "${CADDY_SHA512}  ${archive}" | sha512sum --check --strict
          mkdir -p "$RUNNER_TEMP/caddy"
          tar -xzf "$archive" -C "$RUNNER_TEMP/caddy" caddy
          "$RUNNER_TEMP/caddy/caddy" version
          echo "BF_CADDY_BIN=$RUNNER_TEMP/caddy/caddy" >> "$GITHUB_ENV"
      - name: Python environment (uv sync --frozen)
        run: bash scripts/ci/step.sh "uv sync" uv sync --frozen
      - name: pytest
        env:
          STEP_SLOW_S: ${{ inputs.full-suite && '1200' || '600' }} # notice above this; the fast suite takes 4-5 min
        run: >-
          bash scripts/ci/step.sh "pytest"
          uv run --frozen pytest tests -q -ra --durations=25
          --junitxml="$RUNNER_TEMP/pytest-report.xml"
      - name: Test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report${{ inputs.full-suite && '-full' || '' }}
          path: ${{ runner.temp }}/pytest-report.xml
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install (pnpm-lock.yaml, frozen)
        run: bash ../scripts/ci/step.sh "pnpm install" pnpm install --frozen-lockfile
      - name: Prettier and ESLint
        run: bash ../scripts/ci/step.sh "Prettier and ESLint" pnpm lint
      - name: svelte-check
        run: bash ../scripts/ci/step.sh "svelte-check" pnpm check
      - name: Vitest
        run: bash ../scripts/ci/step.sh "Vitest" pnpm test
      - name: TypeScript client matches the committed OpenAPI schema
        run: >-
          bash ../scripts/ci/step.sh "TypeScript client"
          sh -c 'pnpm api:types && git diff --exit-code -- src/lib/api/schema.d.ts'
      - name: Build (static SPA, 200.html fallback)
        run: bash ../scripts/ci/step.sh "Build" pnpm build
      - name: Chromium for the UI audit
        run: |
          sudo rm -f /var/lib/man-db/auto-update # skip the man-db trigger of apt (tens of seconds on the runners)
          bash ../scripts/ci/step.sh "Playwright install" pnpm exec playwright install --with-deps chromium
      - name: UI audit (axe-core, layout and keyboard checks, three viewports)
        run: bash ../scripts/ci/step.sh "UI audit" pnpm audit:ui --out "$RUNNER_TEMP/ui-audit"
      - name: UI audit report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-audit${{ inputs.full-suite && '-full' || '' }}
          path: ${{ runner.temp }}/ui-audit
          retention-days: 14
