name: Release Deploy

on:
  push:
    branches:
      - production

permissions:
  contents: read

concurrency:
  group: release-deploy-raspberry-pi
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.11.16"
  PI_REPO_DIR: /home/voptimaise/Desktop/Evonith/evonith_bf_webapp
  BACKEND_SERVICE: evonith-backend
  DEPLOY_HEALTH_URL: http://127.0.0.1:80/api/v1/health
  DEPLOY_READINESS_URL: http://127.0.0.1:80/api/v1/readiness
  LLM_PROVIDER: openai
  OPENAI_API_KEY: ci-placeholder
  QDRANT_URL: http://localhost:6333

jobs:
  test:
    name: Test release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Show tool versions
        run: |
          python --version
          uv --version

      - name: Install locked development dependencies
        if: ${{ hashFiles('uv.lock') != '' }}
        run: uv sync --frozen --group dev

      - name: Install pip development dependencies
        if: ${{ hashFiles('uv.lock') == '' }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f requirements/dev.txt ]; then
            python -m pip install -r requirements/dev.txt
          else
            python -m pip install -e .
          fi

      - name: Validate deployment shell scripts
        run: bash -n scripts/edge_start_backend.sh scripts/bootstrap_edge_host.sh scripts/deploy_edge_release.sh

      - name: Run repository tests
        if: ${{ hashFiles('uv.lock') != '' }}
        run: uv run pytest tests -q

      - name: Run repository tests with pip
        if: ${{ hashFiles('uv.lock') == '' }}
        run: python -m pytest tests -q

  deploy:
    name: Deploy to Raspberry Pi
    needs: test
    runs-on: [self-hosted, linux, evonith-pi]
    timeout-minutes: 30
    environment: raspberry-pi-production
    steps:
      - name: Deploy exact tested commit
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          EVONITH_BACKEND_SERVICE="$BACKEND_SERVICE" \
          EVONITH_DEPLOY_HEALTH_URL="$DEPLOY_HEALTH_URL" \
          EVONITH_DEPLOY_READINESS_URL="$DEPLOY_READINESS_URL" \
          "$PI_REPO_DIR/scripts/deploy_edge_release.sh" \
            --repo-dir "$PI_REPO_DIR" \
            --ref "$RELEASE_SHA" \
            --branch production \
            --device raspberry-pi
