# Release artefacts (programme #262, SV-0.11 #280). A tag v* runs the full CI workflow; when it passes, the release of
# that tag receives:
#
#   frontend-build.tar.gz   the static SPA: build/ (index files, 200.html fallback, _app/immutable assets);
#                           release.sh (SV-6.4, #318) unpacks it into <release>/frontend/
#   uv.lock, pnpm-lock.yaml the lock files of the tagged commit (uv sync --frozen on the Jetson)
#   SHA256SUMS              SHA-256 of the three files
#
# deploy/jetson/release.sh <tag> installs them with the tag's source archive on the Jetson (SV-6.4, #318).
#
# Re-running the workflow for an existing release replaces its files. Manual runs only (user decision 29 Oct 2026, to
# save GitHub Actions minutes): pushing a tag starts nothing; run it on the tag with
# `gh workflow run release.yml --ref v<x.y.z>` (github.ref_name is then the tag).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.0"

jobs:
  ci:
    name: CI (full suite)
    uses: ./.github/workflows/ci.yml
    with:
      full-suite: true

  publish:
    name: Publish the release artefacts
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the SPA
        working-directory: frontend
        env:
          BF_BUILD_VERSION: ${{ github.ref_name }} # build/_app/version.json = the tag (footer, release.sh smoke test)
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Package
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          # Same bytes for the same build: sorted entries, fixed owner, the commit time as mtime, no gzip timestamp.
          epoch="$(git log -1 --format=%ct)"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${epoch}" -C frontend -cf - build \
            | gzip -9 -n > "$dist/frontend-build.tar.gz"
          cp uv.lock "$dist/uv.lock"
          cp frontend/pnpm-lock.yaml "$dist/pnpm-lock.yaml"
          (cd "$dist" && sha256sum frontend-build.tar.gz uv.lock pnpm-lock.yaml > SHA256SUMS && cat SHA256SUMS)
          tar -tzf "$dist/frontend-build.tar.gz" build/200.html build/_app/version.json > /dev/null # exit 2 if missing
          echo "DIST=$dist" >> "$GITHUB_ENV"
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=("$DIST/frontend-build.tar.gz" "$DIST/uv.lock" "$DIST/pnpm-lock.yaml" "$DIST/SHA256SUMS")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --generate-notes
          fi
