[project]
name = "evonith-bf-webapp"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "furnace_data",
]

[tool.uv.sources]
furnace_data = { path = "./packages/furnace-data", editable = true }

[tool.black]
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.evonith.apps]
backend = "apps.backend_api.app.main:app"
frontend = "apps/frontend_streamlit/app.py"
legacy_backend = "furnace-data-service/app/main.py"
legacy_frontend = "src/app.py"
shared_package = "furnace_data"


[dependency-groups]
backend-base = [
    "bcrypt>=4.2.0",
    "certifi>=2024.0.0",
    "fastapi>=0.115.0",
    "furnace_data",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]
backend-data = [
    "influxdb3-python>=0.8.0",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.0",
    "pyarrow>=18.1.0",
]
backend-ml = [
    "joblib>=1.4.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.15.0",
    "xgboost>=3.2.0",
]
backend-ai = [
    "anthropic>=0.42.0",
    "openai>=1.102.0",
    "tiktoken>=0.8.0",
]
backend-vector = [
    "qdrant-client>=1.12.0",
    "sentence-transformers>=2.6.1",
    "torch>=2.2.2",
    "voyageai>=0.3.2",
]
backend-documents = [
    "pymupdf>=1.26.5",
    "pypdf>=5.1.0",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]
frontend = [
    "httpx>=0.27.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "pillow>=11.1.0",
    "plotly>=6.0.1",
    "plotly-express>=0.4.1",
    "pydeck>=0.9.1",
    "pygwalker>=0.4.9.13",
    "requests>=2.32.0",
    "seaborn>=0.13.0",
    "streamlit>=1.56.0",
    "streamlit-autorefresh>=1.0.1",
    "streamlit-cookies-manager>=0.2.0",
    "tabulate>=0.9.0",
]
dev = [
    { include-group = "backend-base" },
    { include-group = "backend-data" },
    { include-group = "backend-ml" },
    { include-group = "backend-ai" },
    { include-group = "backend-vector" },
    { include-group = "backend-documents" },
    { include-group = "frontend" },
    "black>=25.11.0",
    "isort>=6.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=5.0.0",
]
edge = [
    "bcrypt>=4.2.0",
    "certifi>=2024.0.0",
    "fastapi>=0.115.0",
    "furnace_data",
    "httpx>=0.27.0",
    "influxdb3-python>=0.8.0",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.5.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]
