[project]
name = "furnace_data"
version = "0.1.3"
description = "Shared data-access core for the Evonith BF2 platform (InfluxDB, PostgreSQL, static CSV)"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "influxdb3-python>=0.8.0",
    "certifi>=2024.0.0",
    "pytz>=2024.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "scikit-learn>=1.5.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["furnace_data"]
