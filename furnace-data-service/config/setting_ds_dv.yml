influxdb:
  host: "https://eu-central-1-1.aws.cloud2.influxdata.com"
  org: "Blast Furnace, Evonith"
  database: "bf2_evonith_raw" # Bucket name
  write: "True"

website_vars:
  api_url: "https://mcartalert.com/WebService/GeneralService.asmx/realtimedataVP"
  email_missing_vars: "True"

DATA: "src/data/V13_df_filtered.csv"

influx_offline:
  database: bf2_evonith_offline_utc

offline_measurements:
  Bunker Report: "rm_updated_data"
  DPR: "dpr_data"
  HM & Slag: "hotmetal_slag_updated_data"
  Charge: "latest_charge_data"

dataset_refresh:
  enabled: true
  auto_enqueue_on_page_hit: true
  min_refresh_interval_hours: 6
  offline_lag_days: 2
  active_table: "ml_dataset.active_hourly"
  keep_versions: 3
  allow_manual_refresh_roles: ["admin", "supervisor"]
  stale_running_timeout_hours: 12

ml_dataset:
  bucket: "ML DATASET"
  measurement_step1: "rm_charge_dis_hm_slag"
  rm_charge_measurement: "rm_charge_dataset"
  rm_dpr_measurement: "rm_dpr_data"
  local_tz: "Asia/Kolkata"
  cutoff_date: "2025-08-24"
  static_dataset_path: "src/data/V14_df_filtered.csv"

# Geometries
paths:
 geometry: "./src/geometries"

plot:
  circular:
    r_inner: 30
    r_outer: 100
    radial_steps: 100
    theta_steps: 360
  contour:
    furnace_grid_X_low: -4
    furnace_grid_X_high: 0
    furnace_grid_Y_low: 0
    furnace_grid_Y_high: 20
    grid_divisions: 200
  geometry:
    geometry_points:
      - [-2.8, 4.374]
      - [-2.8, 6.795]
      - [-3.150, 8.335]
      - [-3.15, 11.290]
      - [-3.65, 14.390]
      - [-3.650, 15.89]
      - [-2.898, 20]
    
    sensors_at_y:
      - [7, 13, 13, 13, 12, 14, 14, 12, 4, 4, 4]

    heights:
      - [4.373, 5.411, 5.757, 6.103, 6.795, 7.565, 8.335, 9.105, 12.975, 15.162, 18.660]

    heights_dict:
        "4373":
          level: 4.373
          n_sensors: 7
        "5411":
          level: 5.411
          n_sensors: 13
        "5757":
          level: 5.757
          n_sensors: 13
        "6103":
          level: 6.103
          n_sensors: 13
        "6795":
          level: 6.795
          n_sensors: 12
        "7565":
          level: 7.565
          n_sensors: 14
        "8335":
          level: 8.335
          n_sensors: 14
        "9105":
          level: 9.105
          n_sensors: 12
        "12975":
          level: 12.975
          n_sensors: 4
        "15162":
          level: 15.162
          n_sensors: 4
        "18660":
          level: 18.660
          n_sensors: 4

    regions:
      - ["Hearth", 5.5]
      - ["Tuyere", 10.5]
      - ["Bosh", 12.9]
      - ["Belly", 15]
      - ["Stack", 17.0]

Coke to PCI: 0.53

Parameter Synonyms:
  TotalFuelRate:
    NameInMLData: "Act. Fuel RateKg/Thm."
    NameInMCartech: "BF2 Fuel rate (Kg/THM)"
    InfluxBucket: "bf2_evonith_raw"
    InfluxMeasurement: "process_params"
    InfluxName: "fuel_rate"
  EtaCO:
    NameInMLData: "FurnaceTopGasAnalysisCO2ETACO"
    NameInMCartech: "BF2_BODY_ETACO"
    InfluxBucket: "bf2_evonith_raw"
    InfluxMeasurement: "process_params"
    InfluxName: "body_etaco"
  ProductionRate:
    NameInMLData: "ProductionTonnesPerHr"
