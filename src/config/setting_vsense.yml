      - ORE_%CaO
      - ORE_%Fe(T)
      - ORE_%K2O
      - ORE_%LOI
      - ORE_%MgO
      - ORE_%MnO
      - ORE_%Na2O
      - ORE_%P
      - ORE_%SiO2
      - ORE_%TiO2
      - ORE_%TM
