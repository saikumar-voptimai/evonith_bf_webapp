influxdb:
  host: "https://eu-central-1-1.aws.cloud2.influxdata.com"
  org: "Blast Furnace, Evonith"
  database: "bf2_evonith_raw" # Bucket name
  write: "True"

website_vars:
  api_url: "https://mcartalert.com/WebService/GeneralService.asmx/realtimedataVP"
  email_missing_vars: "True"

DATA: "src/assets/data/furnace_dataset.csv"

influx_offline:
  database: bf2_evonith_offline_utc

offline_measurements:
  Bunker Report: "rm_updated_data"
  DPR: "dpr_data"
  HM & Slag: "hotmetal_slag_updated_data"
  Charge: "latest_charge_data"

ml_dataset:
  bucket: "ML DATASET"
  measurement_step1: "rm_charge_dis_hm_slag"
  rm_charge_measurement: "rm_charge_dataset"
  rm_dpr_measurement: "rm_dpr_data"
  local_tz: "Asia/Kolkata"
  cutoff_date: "2025-12-06"
  static_dataset_path: "src/data/V14_df_filtered.csv"
  # InfluxDB process_params field name → ML dataset column name (rename_dict key)
  online_params:
    fuel_rate: fuel_rate
    coke_rate: coke_rate
    coal_rate_actual_value: actual_kg_thm
    charges_per_hour: charges_per_hr
    production_per_hour: production_per_hour
    body_etaco: body_etaco
    body_raft: raft_temp_c
    body_perm: permeability_kgs_hr
    hot_blast_vol_nm3h: hot_blast_volume_nm3hr
    hot_blast_press: hot_blast_pressure_bar
    hot_blast_temp: hot_blast_temp_c
    top_press_avg: top_pressure_bar
    top_temp_1: ftg_uptake_cat16_c
    top_temp_2: ftg_uptake_bt12_c
    top_temp_3: ftg_uptake_ct08_c
    top_temp_4: ftg_uptake_dt04_c
    top_temp_avg: ftg_uptake_avg_c
    oxygen_flow: oxygen_flow_nm3hr
    oxygen_enrichment_pct: o2_enrichment_pct
    steam_injection: steam_kgs_hr
    tuyere_velocity: tuyere_velocity_ms
    body_dp_total: differential_pressure_total_bar
    body_dp_bottom: bottom_pressure_bar
    body_dp_top: top_bar
    co_pct: furnace_top_gas_analysis_co_pct
    co2_pct: furnace_top_gas_analysis_co2_pct
    h2_pct: furnace_top_gas_analysis_h2_pct
