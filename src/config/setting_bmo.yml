  slag_balance:
    enabled: true
    # PI chemistry fallbacks: used only when live HM_SLAG fetch fails.
    # Live values from offline_feed.hot_metal_slag_analysis override these.
    carbon_pct: 4.2
    silicon_pct: 0.7
    sulphur_pct: 0.03
    other_pct: 0.1
    pi_loss_pct: 0.2
    fe_to_pig_iron_fraction: 0.999
    mn_recovery_pct: 60.0
    sulphur_gas_loss_pct: 10.0
    alkali_to_slag_fraction: 0.8
    si_to_sio2_factor: 2.14
    fe_to_feo_factor: 1.2857142857
    mn_to_mno_factor: 1.291
    # With HM-driven PI chemistry the slag balance is self-consistent;
    # leave correction at 1.0 unless empirical calibration is still needed.
    slag_correction_factor: 1.0

  # What LP and DE anchor their reported fuel rates to, before the coke-rate
  # correction below is applied.
  #
  #   model_cost  - back-solve coke as the residual of the model's predicted cost:
  #                     coke = (predicted cost - PCI x p_pci - 70 x p_nut) / p_coke
  #                 Nut coke and PCI are pinned to the operator's Fuel Ash inputs,
  #                 so coke is the only unknown and the reported rate stays a
  #                 PREDICTION.
  #   observed    - read the current plant coke rate off the Fuel Ash table
  #                 instead, and rebase the blend's fuel cost to match.
  #
  # WHY model_cost IS THE DEFAULT. The coke rate BMO reports has to be a
  # prediction of what this blend will need, not a restatement of what the
  # furnace happened to be running an hour ago. Anchoring on the live coke tag
  # turns an input into the answer: every recommendation would open at today's
  # coke rate and differ from it only by the physics correction, which is not a
  # forecast of the blend at all. ``observed`` remains available for diagnosing
  # the level, but it should not drive an operating recommendation.
  #
  # KNOWN LIMITATION of model_cost, measured 2026-07-30. The model's cost output
  # is very nearly a constant (~13,364 Rs/THM - doubling ORE_CALC_THM moves it
  # 0.012%). Back-solving coke from it gives
  #     total fuel = (x - 70 x 24)/28 + 70 + PCI x (1 - 18/28)
  #                ~ 487 + 0.357 x PCI
  # so the anchor sits near 546-552 kg/THM for any realistic PCI and carries
  # almost no blend information of its own. The blend sensitivity therefore comes
  # entirely from coke_rate_correction below. Note also that the decomposition
  # conserves cost rather than mass: a PCI reading 15 kg/THM low does not cut
  # total fuel by 15, it cuts it by 5 and inflates coke by 9.
  #
  # Switching anchors cannot change which blend the optimizer picks: both are
  # near-constant across blends, so the difference is an offset, not a gradient.
  # It changes the reported level only.
  fuel_rate_anchor_basis: model_cost

  # ---------------------------------------------------------------------------
  # Physics-based coke-rate correction.
  #
  # WHY THIS EXISTS. The deployed fuel unit-cost model (unitcost_fuel_model.json,
  # 256 features) is functionally blind to the burden: doubling ORE_CALC_THM
  # moves the prediction 1.6 Rs/THM out of 13,364 (0.012%), flux x8 gives
  # -5 Rs/THM, and TOTAL_CLO_THM x1.5 gives +1.2 Rs/THM. The Si model is
  # similarly blend-flat (0.371 -> 0.384 %Si at 2x sinter).
  #
  # Plant history cannot supply the missing sensitivity either. Across 6,219
  # hourly rows and 477 DPR days the slag coefficient bounces from -35 to +0.3 kg
  # fuel per 100 kg slag depending on specification (R2 <= 0.155, r ~ 0.05-0.15),
  # Si comes out at -7.2 per 0.1% where physics says +5, and blast temperature
  # has the wrong sign. That is a lagged control loop, not physics: fuel rate
  # against thermal state correlates -0.45 contemporaneously (the operator
  # cutting fuel when the furnace runs hot) but flips POSITIVE at lags 4-9 h,
  # peaking at 6-7 h - exactly burden descent time. The direction is recoverable
  # from plant data; the magnitude is not, because the controller cancels the
  # very excursion one would need to measure. Retraining cannot fix this.
  #
  # Only 8 of 256 DPR days exceed 800 MT/day slag and ZERO exceed 850, so a
  # 900 MT/day scenario is pure extrapolation. Every coefficient below is
  # therefore derived from first principles, with plant data used only as a
  # plausibility bound. This layer supplies the ENTIRE blend -> fuel sensitivity.
  #
  # FORM.  coke_rate_corrected = coke_rate_anchor + clamp(sum of dCoke_i)
  #        dCoke_i = k_i * (x_i_blend - x_i_reference)
  # The anchor is the existing model-derived coke rate (provenance unchanged) and
  # the reference is the RECENT OBSERVED operating point, so the correction is
  # exactly zero when the blend reproduces current conditions.
  coke_rate_correction:
    enabled: true
    # false -> compute and display only. Display-only will NOT stop the optimizer
    # choosing low-Fe blends, which is the whole point of this layer: it would
    # attach a large correction to a blend chosen precisely because it ignored
    # that correction.
    apply_to_objective: true
    # The manual blend is the operator's realised-cost reference. Its correction
    # is computed and shown - a large value there means the reference point is
    # mis-set - but is not added to its cost.
    apply_to_manual_blend: false

    guardrails:
      max_abs_correction_kg_thm: 60.0
      # Smooth tanh compression begins at 0.6 x the cap (36 kg/THM) so the
      # objective has no hard kink for differential evolution to trip over.
      taper_start_fraction: 0.6
      coke_rate_band_kg_thm: [280.0, 420.0]
      total_fuel_rate_band_kg_thm: [480.0, 680.0]

    terms:
      # ---- 1. SLAG HEAT ------------------------------------------------------
      # EMPIRICALLY ANCHORED - this is the one coefficient this plant's data can
      # actually measure. Full derivation and diagnostics in
      # docs/bmo_fuel_slag_si_findings.md section 2.
      #
      # Daily mass balance over 222 days. Coke and burden masses come from
      # offline_feed.charge_data, NOT from COKE_CALC_MT, which correlates only
      # +0.16 with the actual charge dumps and made earlier estimates useless:
      #     fuel MT/day ~ hot metal t/day + slag MT/day + controls
      # Six specifications, adding blast, RM strength, burden distribution, Si
      # and eta CO in turn, give +18.4 to +26.9 kg fuel per 100 kg slag, every
      # one significant at p<0.001. Bootstrap median +20.9, 90% CI [+11.4,+30.0].
      # Instrumenting with burden-only slag to purge the shared coke-ash error
      # gives +20.0 +/- 7.8 against an OLS +21.8, so shared error is worth <2.
      #
      # 22 sits within one standard error of every estimate and slightly on the
      # cautious side: a higher coefficient penalises lean burden more, and this
      # tool's failure mode is over-buying cheap high-gangue ore.
      #
      # PHYSICS CROSS-CHECK. The coefficient is slag enthalpy over marginal coke
      # heat. Slag enthalpy at ~1500 C is cp 1.25 kJ/kg.K x ~1475 K + 0.21 MJ/kg
      # of fusion ~ 1.8 MJ/kg. At k=0.22 that implies 1.8/0.22 = 8.2 MJ/kg of
      # usable coke heat in the lower zone. The previous value of 30 assumed
      # 6.0 MJ/kg, which was a mid-range guess with no plant basis.
      #
      # KNOWN UNCERTAINTY: substituting DPR measured slag for the Al2O3 tracer
      # gives +9.0 +/- 8.3, not significant. The two agree on level (727 vs 739
      # MT/day) but correlate only +0.59 day to day, and the regression lives on
      # day-to-day variation. Reconciled slag weighing would settle this.
      slag_heat:
        enabled: true
        kg_coke_per_100kg_slag: 22.0
        max_abs_kg_thm: 45.0
        # Observed slag rate spans roughly +/- 60 kg/THM around a normal
        # operating point. Deviations beyond 1.5x this are compressed rather
        # than extrapolated linearly.
        envelope_halfwidth_kg_per_thm: 60.0
        reference_source: observed_dpr    # observed_dpr | model_current
        reference_fixed_kg_per_thm: 320.0 # only if neither source resolves

      # ---- 2. FLUX CALCINATION ----------------------------------------------
      # Driven by CO2 RELEASED from carbonate flux (flux LOI), NOT total flux
      # mass. AVOIDING DOUBLE-COUNTING: the CaO/MgO residue of the flux already
      # enters slag mass and is therefore already charged by slag_heat above.
      # This term charges only what slag_heat cannot see - the CO2 leaving as gas.
      #   CaCO3 -> CaO + CO2 : 178 kJ/mol = 1.78 MJ/kg CaCO3. Most of this
      #                        endotherm is met by top gas ABOVE the thermal
      #                        reserve zone, so it is not charged at the marginal
      #                        lower-zone rate.
      #   Boudouard C + CO2 -> 2CO : consumes 12 kg C per 44 kg CO2
      #                        = 0.273 kg C per kg CO2, or ~0.31 kg coke at 87%
      #                        C in coke. This dominates.
      #   => k ~ 0.30 kg coke per kg CO2 = 30 per 100 kg CO2/THM. Band 25-45.
      #
      # OPERATOR NOTE: this adds roughly 3,400 Rs/MT to limestone that costs
      # 1,800 Rs/MT, so the LP may decline raw carbonate flux entirely. That is
      # physically correct - calcination really is expensive, which is why
      # pre-calcined burden is preferred - but it is a visible behaviour change.
      # Set enabled: false to switch it off without touching the other terms.
      #
      # KNOWN GAP: OreChemistry carries no LOI field, so ore/sinter carbonates
      # are not captured. Sinter and pellet are pre-calcined so the gap is small
      # for this burden, but it is a gap, not an assumption that ore LOI is zero.
      flux_calcination:
        enabled: true
        kg_coke_per_100kg_co2: 30.0
        max_abs_kg_thm: 25.0
        envelope_halfwidth_kg_per_thm: 15.0
        reference_source: model_current

      # ---- 3. BURDEN OXYGEN / DIRECT REDUCTION -------------------------------
      # Oxygen bound to Fe differs across the burden: Fe2O3 carries 48/112 =
      # 0.4286 kg O per kg Fe, FeO carries 16/56 = 0.2857. The fraction reduced
      # directly (FeO + C -> Fe + CO) consumes 1 mol C per mol O = 0.75 kg C per
      # kg O. At a ~30% direct-reduction fraction and 87% C in coke:
      #   0.30 x 0.75 / 0.87 = 0.26 kg coke per kg extra O.
      # SCALE CHECK: a full 100% sinter -> 100% pellet swing is only ~13.6 kg
      # extra O/THM, i.e. ~3.5 kg coke/THM. Genuinely modest - hence disabled by
      # default; enable once the slag and flux terms are trusted.
      burden_oxygen:
        enabled: false
        kg_coke_per_kg_oxygen: 0.26
        max_abs_kg_thm: 20.0
        envelope_halfwidth_kg_per_thm: 25.0
        reference_source: model_current

      # ---- 4. HOT-METAL SILICON ----------------------------------------------
      #   SiO2 + 2C -> Si + 2CO : 690 kJ/mol Si = 690/28.09 = 24.6 MJ/kg Si
      #   heat  : 24.6 / 6.0 MJ/kg   = 4.1 kg coke per kg Si
      #   carbon: 2 mol C per mol Si = 24.02/28.09 = 0.857 kg C per kg Si,
      #                                /0.87 = 0.98 kg coke per kg Si
      #   => ~5.1 kg coke per kg Si. 0.1% Si on 1000 kg HM is 1.0 kg Si/THM.
      #
      # HONEST EXPECTATION: this term will contribute ~ZERO today. Its input is
      # the Si model, which is blend-flat (0.371 -> 0.384 %Si at 2x sinter). It
      # is included because the physics is right and because it becomes live the
      # moment a blend-sensitive Si model is deployed - not because it currently
      # moves the answer. Do NOT inflate the coefficient to compensate; there is
      # a test that fails if someone does.
      #
      # reference_source is deliberately model_current (the Si model's own
      # prediction for the current burden) and NOT the measured cast Si: using
      # measured Si would turn the model's constant offset into a constant,
      # blend-independent bias - pure noise.
      hot_metal_si:
        enabled: true
        kg_coke_per_0p1pct_si: 5.0
        max_abs_kg_thm: 15.0
        envelope_halfwidth_pct: 0.25
        reference_source: model_current

      # ---- 5. OPERATOR-CONDITION TERMS (schema only) -------------------------
      # These do NOT move with the blend. reference == current, so they
      # contribute exactly 0.0 until a what-if input exists on the page. Shipped
      # disabled so the breakdown table has no rows that always read zero; the
      # term loop is generic, so enabling them later is config plus one input.
      hm_temperature:
        enabled: false
        kg_coke_per_10c: 2.5
        max_abs_kg_thm: 15.0
        envelope_halfwidth_c: 40.0
        reference_source: observed_current
      blast_temperature:
        enabled: false
        kg_coke_per_100c: -10.0
        max_abs_kg_thm: 20.0
        envelope_halfwidth_c: 120.0
        reference_source: observed_current

  optimization:
    enabled: true
    # Where DE gets its starting population.
    #   lp             - seed from the LP baseline; if the LP is infeasible, DE
    #                    does not run at all (the old behaviour)
    #   random         - ignore the LP and search from a population spread across
    #                    the whole share simplex
    #   lp_else_random - prefer the LP seed, fall back to random when it fails
    #
    # An infeasible LP does not always mean the problem is unsatisfiable: the LP
    # optimises a LINEARISED slag and basicity model, so it can reject a burden
    # the exact evaluation would accept. DE scores with soft penalties, so it can
    # still return a best-effort blend with its violations listed, which is more
    # use to an operator than an empty result pane. The blend records which seed
    # it actually used under diagnostics["de_seed"].
    initial_solution: lp_else_random
    strategy: best1bin
    maxiter: 30
    popsize: 10
    tol: 0.02
    polish: false
    seed: 42
    penalty_large: 1000000.0
    penalty_stock: 2500.0
    penalty_share: 2500.0
    penalty_sum: 5000.0
    penalty_fe: 3000.0
    penalty_production_excess: 3000.0
    penalty_slag: 3000.0
    penalty_basicity: 50000.0

  fallback_fuel_model:
    target_sinter_share_pct: 60.0
    sinter_deviation_sensitivity_rs_per_thm: 1200.0
    default_rates_kg_per_thm:
      coke_rate_kg_per_thm: 340.0
      nut_coke_rate_kg_per_thm: 70.0
      pci_rate_kg_per_thm: 170.0
    default_prices_rs_per_kg:
      coke_price_rs_per_kg: 28.0
      nut_coke_price_rs_per_kg: 24.0
      pci_price_rs_per_kg: 18.0

  model_bundle:
    strict_loading: false
    model_path: src/assets/models/unitcost_fuel_model.json
    scaler_path: src/assets/models/unitcost_fuel_scaler.joblib
    selected_feature_columns_path: src/assets/models/unitcost_fuel_feature_columns.json
    feature_manifest_path: src/assets/models/bmo_fuel/feature_manifest.json
    lag_map_path: src/assets/models/bmo_fuel/lag_map.json
    training_metrics_path: src/assets/models/bmo_fuel/training_metrics.json

  # Hot-metal Silicon (Si) prediction model. Display-only: predicted for the
  # baseline and DE blends, NOT an optimization objective or constraint.
  si_model_bundle:
    strict_loading: false
    model_path: src/assets/models/hm_si_model.json
    scaler_path: src/assets/models/hm_si_scaler.joblib
    selected_feature_columns_path: src/assets/models/hm_si_feature_columns.json

  data_sources:
    static_dataset_path: src/assets/data/furnace_dataset.csv
    stock_table: offline_feed.raw_material_stock
    stock_time_range: last 1 week
    stock_fallback_reference_qty_mt: 3800.0
    chemistry_time_range_days: 30
    latest_usage_lookback_days: 365
    pellet_auto_select_lookback_days: 30
    pellet_chemistry_max_age_days: 30
    static_refresh_max_age_minutes: 60

  ui:
    show_manual_compare: true
    auto_select_active_pellet: true
    default_selected_ores:
      - SINTER (SP-02)
      - GEOMIN CLO
      - LLOYDS CLO
      - NMDC DONIMALAI
      - GOMTI CLO

  optimization_runtime:
    dataset:
      static_dataset_path: src/assets/data/furnace_dataset.csv
      refresh_enabled: false
      refresh_rm_choice: RM Charge
    model_bundle:
      model_path: src/assets/models/unitcost_fuel_model.json
      scaler_path: src/assets/models/unitcost_fuel_scaler.joblib
      selected_feature_columns_path: src/assets/models/unitcost_fuel_feature_columns.json
      feature_manifest_path: src/assets/models/bmo_fuel/feature_manifest.json
      lag_map_path: src/assets/models/bmo_fuel/lag_map.json
      training_metrics_path: src/assets/models/bmo_fuel/training_metrics.json
