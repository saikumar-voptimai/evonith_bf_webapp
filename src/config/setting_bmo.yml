bmo:
  objective_basis: rs_per_thm
  timezone: Asia/Kolkata
  chemistry_mode: latest
  chemistry_window_days: 30

  target:
    target_production_mt: 2350.0
    target_slag_qty_mt: 750.0
    target_slag_basicity_min: 0.0
    target_slag_basicity_max: 10.0
    target_slag_t_basicity_min: 0.0
    target_slag_t_basicity_max: 10.0

  chemistry:
    feo_in_slag_pct: 0.4

  # Charging-throughput ceiling on the wet burden the optimizer may plan.
  #
  # The furnace accepts at most ``max_charges_per_hour`` charges of about
  # ``charge_mass_mt`` each, and part of every charge is nut coke, which is not
  # an optimizer variable. What is left is the daily room for IBRM (ore, sinter,
  # pellet) plus flux:
  #
  #   max_ibrm_flux_mt = 26.4 * 7.5 * 24 - 160 = 4592 MT
  #
  # Without this cap the optimizer is free to answer a low-Fe burden by simply
  # charging more of it. The plant cannot: charges are already at capacity, so
  # more tonnes at a lower Fe% means holding the charge rate and losing yield,
  # or raising oxygen the plant does not have. The ceiling is expressed per MT
  # of hot metal (4592 / 2350 = 1.954) so it re-scales with the operator's
  # target rather than being pinned to a 2350 MT day.
  burden_capacity:
    enabled: true
    max_charges_per_hour: 7.5
    charge_mass_mt: 26.4
    hours_per_day: 24.0
    # Nut coke rides in the same charges but is not optimised here; it is capped
    # at 70 kg/THM, about 160 MT/day, and reserved off the top.
    nut_coke_reserved_mt: 160.0
    # Hot metal the raw capacity above was derived against; only used to turn
    # that absolute daily capacity into the per-MT-HM ratio.
    reference_hot_metal_mt: 2350.0

  fuel_ash_inputs:
    - fuel_id: coke
      display_name: Coke
      enabled: true
      rate_kg_per_thm: 340.0
      price_rs_per_mt: 28000.0
