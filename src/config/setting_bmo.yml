      loi_pct: 0.0

  dust_inputs:
    - dust_id: bf_gas_dust
      display_name: BF Gas Dust
      enabled: true
      wet_qty_mt: 0.0
      moisture_pct: 0.0
      sio2_pct: 0.0
      al2o3_pct: 0.0
      cao_pct: 0.0
      mgo_pct: 0.0
      fe_pct: 0.0
      mn_pct: 0.0
      p_pct: 0.0
      s_pct: 0.0
      ti_pct: 0.0
      zn_pct: 0.0
      na2o_pct: 0.0
      k2o_pct: 0.0
      caf2_pct: 0.0

  slag_balance:
    enabled: true
    # PI chemistry fallbacks: used only when live HM_SLAG fetch fails.
    # Live values from offline_feed.hot_metal_slag_analysis override these.
    carbon_pct: 4.2
    silicon_pct: 0.7
    sulphur_pct: 0.03
    other_pct: 0.1
    pi_loss_pct: 0.2
    fe_to_pig_iron_fraction: 0.999
    mn_recovery_pct: 60.0
    sulphur_gas_loss_pct: 10.0
    alkali_to_slag_fraction: 0.8
    si_to_sio2_factor: 2.14
    fe_to_feo_factor: 1.2857142857
    mn_to_mno_factor: 1.291
    # With HM-driven PI chemistry the slag balance is self-consistent;
    # leave correction at 1.0 unless empirical calibration is still needed.
    slag_correction_factor: 1.0

  optimization:
    enabled: true
    strategy: best1bin
    maxiter: 30
    popsize: 10
    tol: 0.02
    polish: false
    seed: 42
    penalty_large: 1000000.0
    penalty_stock: 2500.0
    penalty_share: 2500.0
    penalty_sum: 5000.0
    penalty_fe: 3000.0
    penalty_production_excess: 3000.0
    penalty_slag: 3000.0

  fallback_fuel_model:
    target_sinter_share_pct: 60.0
    sinter_deviation_sensitivity_rs_per_thm: 1200.0
    default_rates_kg_per_thm:
      coke_rate_kg_per_thm: 340.0
      nut_coke_rate_kg_per_thm: 20.0
      pci_rate_kg_per_thm: 170.0
    default_prices_rs_per_kg:
      coke_price_rs_per_kg: 28.0
      nut_coke_price_rs_per_kg: 28.0
      pci_price_rs_per_kg: 15.0

  model_bundle:
    strict_loading: false
    model_path: src/assets/models/bmo_fuel/bmo_xgb_model.json
    scaler_path: src/assets/models/bmo_fuel/bmo_scaler.joblib
    selected_feature_columns_path: src/assets/models/bmo_fuel/bmo_feature_columns.json
    feature_manifest_path: src/assets/models/bmo_fuel/feature_manifest.json
    lag_map_path: src/assets/models/bmo_fuel/lag_map.json
    training_metrics_path: src/assets/models/bmo_fuel/training_metrics.json

  data_sources:
    static_dataset_path: src/assets/data/furnace_dataset.csv
    stock_table: offline_feed.raw_material_stock
    stock_time_range: last 1 week
    stock_fallback_reference_qty_mt: 3800.0
    chemistry_time_range_days: 30
    latest_usage_lookback_days: 365
    pellet_auto_select_lookback_days: 30
    pellet_chemistry_max_age_days: 30
    static_refresh_max_age_minutes: 60

  ui:
    show_manual_compare: true
    auto_select_active_pellet: true
    default_selected_ores:
      - SINTER (SP-02)
      - GEOMIN CLO
      - LLOYDS CLO
      - NMDC DONIMALAI
      - GOMTI CLO

  optimization_runtime:
    dataset:
      static_dataset_path: src/assets/data/furnace_dataset.csv
      refresh_enabled: false
      refresh_rm_choice: RM Charge
    model_bundle:
      model_path: src/assets/models/bmo_fuel/bmo_xgb_model.json
      scaler_path: src/assets/models/bmo_fuel/bmo_scaler.joblib
      selected_feature_columns_path: src/assets/models/bmo_fuel/bmo_feature_columns.json
      feature_manifest_path: src/assets/models/bmo_fuel/feature_manifest.json
      lag_map_path: src/assets/models/bmo_fuel/lag_map.json
      training_metrics_path: src/assets/models/bmo_fuel/training_metrics.json
      strict_loading: false
    feature_policy:
      missing_feature_policy: default_warn
    optimizer:
      strategy: best1bin
      maxiter: 30
      popsize: 10
      tol: 0.02
      polish: false
      seed: 42
