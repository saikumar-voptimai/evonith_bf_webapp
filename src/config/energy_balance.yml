# Blast-furnace energy balance.
#
# CONVENTION, and everything below depends on it:
#
#   Every reductant is credited on the INPUT side at its FULL oxidation
#   potential (C -> CO2, H -> H2O). Whatever the furnace fails to extract
#   leaves at the top as unburnt CO and H2 and is booked on the OUTPUT side.
#   Closure should therefore land at 1.00, not at some lumped efficiency.
#
# A useful consequence: endothermic gasification needs no separate term. For
# H2O + C -> CO + H2 the arithmetic already carries it:
#
#     input   C at full potential                = 393.5 kJ/mol
#     output  CO unburnt 283 + H2 unburnt 242    = 525.0 kJ/mol
#     net                                        = -131.5 kJ/mol  = the endotherm
#
# So blast moisture and burden moisture that gasify must NOT also be charged a
# 7.3 MJ/kg decomposition term. That would be double counting.
#
# Measured closure on 221 days of plant data: median 1.002, across-quarter
# spread 3.2%, within-quarter CV 2.1-2.8%. See
# docs/energy_balance_calculation_procedure.md for a worked day.

energy_balance:
  enabled: true

  # ---- output side: heat consumed or carried away -------------------------
  demand:
    # Fe2O3 -> 2Fe + 3/2 O2 at +824 kJ/mol Fe2O3. The single largest term in the
    # whole balance, around 7,000 MJ/tHM. Pairs with counting carbon at its full
    # combustion potential.
    fe_reduction_mj_per_kg_fe: 7.38
    # Fe that stops at FeO in the slag was only partly reduced.
    # Fe2O3 -> FeO is 7.38 - 4.82 = 2.56.
    fe_to_feo_mj_per_kg_fe: 2.56
    # Hot metal at the plant's stated 1500 C tap temperature: solid Fe 25->1150
    # at 0.75 kJ/kg.K, fusion of pig iron 247 kJ/kg, liquid 1150->1500 at 0.82.
    hot_metal_mj_per_t: 1378.0
    # Slag enthalpy at tap. Same 1.8 MJ/kg the coke correction uses, from which
    # the shipped 22 kg coke / 100 kg slag coefficient was derived.
    slag_mj_per_kg: 1.80
    # SiO2 + 2C -> Si + 2CO, 690 kJ/mol Si.
    silicon_mj_per_kg: 24.6
    manganese_mj_per_kg: 4.8
    # Free burden moisture that EVAPORATES rather than gasifying: latent heat
    # plus sensible to top-gas temperature. Moisture that reacts with carbon is
    # already handled by the convention above - see the module docstring.
    burden_moisture_mj_per_kg: 2.70
    # Flux calcination, per kg CO2 released by LOI. Small at this plant: flux
    # runs about 4 kg/tHM, so this term is a few MJ/tHM.
    calcination_mj_per_kg_co2: 2.46

  # ---- input side ----------------------------------------------------------
  supply:
    # C + O2 -> CO2, 393.5 kJ/mol.
    carbon_full_mj_per_kg: 32.8
    # H2 + 1/2 O2 -> H2O, lower heating value. Water leaves as vapour, so LHV.
    # Per kg of hydrogen ATOMS, which equals per kg H2.
    hydrogen_lhv_mj_per_kg: 120.0
    # OFF BY DEFAULT, deliberately - and this is now a MEASURED decision, not a
    # pending one. Do not switch it on expecting an improvement.
    #
    # Fuel hydrogen is physically a reductant and belongs on the input side. The
    # blocker was long assumed to be the unknown H% (no ultimate analysis exists
    # at this plant or at the vendor). It is not. With H% now fixed from
    # published data for this coal's rank - see fuels.hydrogen_pct - the term
    # still degrades the balance on every measure, across 221 days:
    #
    #     H_pci    closure   implied shell loss   across-quarter drift
    #     off       1.002            597 MJ/tHM         712 MJ/tHM
    #     3.0%      0.953           1,420              668
    #     4.2%      0.937           1,680              652
    #     5.0%      0.927           1,847              631
    #
    # Measured shell loss is 195 MJ/tHM (stave rows 6-10) to 550 (flow-scaled to
    # all circuits). Every H% drives the implied residual further away from it.
    #
    # The falsifying test. If fuel hydrogen were the missing input, the
    # back-calculated shell loss would have to FALL as PCI rate rises, with
    # slope -120 x H_fraction. Over a PCI range of 152-205 kg/tHM the measured
    # correlation is -0.05, i.e. absent, and a regression returns a POSITIVE
    # slope (+16.8 MJ per kg PCI) implying a negative hydrogen content. The
    # hypothesis is refuted by this plant's own record.
    #
    # What that leaves. The residual scales with TOTAL fuel, not with hydrogen:
    # every fuel rate carries a positive coefficient of roughly +17 to +29 MJ
    # per kg, against a carbon credit of 28.5 MJ/kg coke. So only about a third
    # of marginal fuel energy is being absorbed by the modelled outputs. That is
    # a fuel-scaled OUTPUT term still missing - top gas, dust carbon or direct
    # reduction split are the candidates - and until it is found, adding a
    # correct input term simply widens a gap that is not hydrogen's fault.
    #
    # Turn this on only together with whatever closes that gap.
    # See scripts/pci_hydrogen_from_closure.py to re-run the test.
    include_fuel_hydrogen: false
    blast_cp_kj_per_nm3_k: 1.40
    reference_temperature_c: 25.0

  # ---- top gas -------------------------------------------------------------
  top_gas:
    # Volume comes from a nitrogen balance, not a correlation: N2 is inert, so
    # every Nm3 in with the blast leaves at the top.
    #     N2% blast = 100 - O2%   ;   N2% top = 100 - CO - CO2 - H2
    #     V_top     = V_blast * N2%_blast / N2%_top
    # Verified against the record: 1,622 Nm3/tHM median, calorific value
    # ~3.5 MJ/Nm3. Textbook ranges are 1,500-1,700 and 3.2-3.5.
    n2_in_air_pct: 79.2
    co_lhv_mj_per_nm3: 12.63
    h2_lhv_mj_per_nm3: 10.78
    cp_kj_per_nm3_k: 1.38
    # Guard: below this the nitrogen balance is being fed nonsense analysis and
    # the volume would explode.
    min_n2_top_pct: 30.0

  # ---- fuel properties -----------------------------------------------------
  fuels:
    # Carbon as a fraction of dry fuel.
    carbon_fraction:
      coke: 0.87
      nut_coke: 0.87
      pci: 0.75
    # Carbon leaving through the TOP as dust, weight % of the dust.
    #
    # This carbon is charged but never burnt, so it comes off the input side
    # exactly like carbon dissolved in hot metal. dpr_data records four dust
    # streams; only these two leave through the top:
    #     flue_dust_mt   dust catcher, coarse carryover        counted
    #     gcp_dust_mt    gas cleaning plant, fine              counted
    #     cast_house_dust_mt    leaves at the cast house       NOT counted
    #     stock_house_dust_mt   handling loss before charging  NOT counted
    #
    # NOW FROM PLANT XRF DATA, and the literature guesses they replace were
    # badly wrong - GCP dust is more than twice as carbon-rich as assumed, not
    # less. BF-2 only, n=6 each:
    #
    #     stream         LoI %   range        Fe2O3 %   ZnO %
    #     dust catcher   24.83   15.19-44.32    54.84    2.65
    #     GCP            52.29   45.15-55.40    27.28    4.80
    #
    # That ordering is physically right on reflection: GCP dust is the fine
    # fraction that escapes the dust catcher, and fine coke and coal particles
    # carry over furthest, so the fine stream is the carbon-rich one. Its lower
    # Fe2O3 says the same thing.
    #
    # LoI IS THE CARBON PROXY, and one sample proves it. The 07-Apr-25 dust
    # catcher row carries a proximate analysis alongside: Ash 74.49 + LoI 25.51
    # = 100, and VM 7.54 + FC 17.97 = 25.51 exactly. So LoI is the combustible
    # fraction. Carbon is FC plus the carbon within VM, i.e. slightly LESS than
    # LoI - roughly 90% of it at that sample's VM/FC split. These values are
    # 0.90 x LoI on that basis.
    #
    # Averages of six spot samples, so a monthly composite would be better. The
    # dust-catcher spread (15-44% LoI) is wide enough that a single day's figure
    # should not be trusted. Overridable via the operator assumptions table.
    dust_carbon_pct:
      flue: 22.3
      gcp: 47.1
    # Hydrogen as a percentage of fuel as charged.
    #
    # NOT MEASURED, AND WILL NOT BE. offline_feed.fuel_chemistry carries
    # proximate analysis only (ash, FC, VM, moisture, TM); there is no ultimate
    # analysis in the schema, and the vendor does not supply one either. So
    # these are fixed from published data for this coal's RANK, which the
    # proximate analysis is enough to establish. They are estimates, and the
    # provenance string returned by hydrogen_pct_for_fuel says so.
    #
    # PCI. Plant median proximate (n=966): VM 20.03, ash 9.18, moisture 1.45,
    # FC 69.68. On a dry ash-free basis VM = 20.03/89.37 = 22.4%, which places
    # it in the MEDIUM-VOLATILE BITUMINOUS band (22-31% VM dmmf). Note this is
    # imported-grade PCI, NOT indigenous Indian coal - at 9.2% ash it is
    # nowhere near the 35-50% ash of domestic coal, so Indian indigenous coal
    # analyses are the wrong reference class and were not used. Medium-volatile
    # bituminous runs H = 4.5-4.9% daf; taking 4.7% and returning to the
    # as-charged basis, 4.7 x 0.8937 = 4.2%.
    #
    # COKE. Carbonisation drives off nearly all hydrogen: BF coke runs 0.3-0.5%
    # H, and this coke's VM of 0.94% sits at the low end of that. 0.35% used.
    # The absolute contribution is small either way (~1 kg H/tHM).
    #
    # Changing these will NOT improve closure - see supply.include_fuel_hydrogen
    # above, where the whole term is switched off on measured grounds.
    hydrogen_pct:
      coke: 0.35
      nut_coke: 0.35
      pci: 4.2
    # Backstop only, used if a hydrogen_pct above is set to null. Back-solved
    # from the values above at this plant's typical VM, so it reproduces them at
    # today's coals and degrades gracefully if VM drifts. The previous flat 0.25
    # was wrong for coal - it returns 5.0% H at VM 20, above any real
    # medium-volatile bituminous - and is kept only for coke, where the H/VM
    # ratio genuinely is higher because coke VM is largely residual H2.
    hydrogen_from_vm_factor:
      coke: 0.37
      nut_coke: 0.37
      pci: 0.21

  # ---- blast moisture ------------------------------------------------------
  # Ambient humidity carried in with the blast. NOT instrumented - process_params
  # has no humidity tag - so this is a plant-supplied constant. 15 g/Nm3 is the
  # operator's figure; at ~1,175 Nm3/tHM that is 17.6 kg H2O/tHM, contributing
  # about 2.0 kg H/tHM against roughly 7 kg from PCI.
  #
  # It is credited as hydrogen ALREADY OXIDISED, so it gets no input heat. Its
  # effect appears through the extra H2 it puts in the top gas.
  blast_moisture_g_per_nm3: 15.0

  # ---- shell losses --------------------------------------------------------
  shell_loss:
    # Stave heat-load tags read in MW. x3.6 gives GJ/hr (median 16.8, matching
    # the operator's expected 15-20). The "GW.hr -> GJ" conversion of x3600 is
    # 1000x too large - check any production code that applies it.
    heatload_mw_to_gj_per_hr: 3.6
    # Sensor dropouts read 0 and spikes reach 236 MW. This window keeps ~90%.
    valid_range_mw: [2.0, 12.0]
    # Stave rows 6-10 cover bosh, belly and lower stack only. Hearth, bottom,
    # tuyere nose and upper shaft are missing, so the measured figure is scaled
    # by the ratio of total cooling-water flow to the flow through those zones.
    # Crude - it assumes equal dT across circuits - but the result (550 MJ/tHM)
    # agrees within 9% with the 597 MJ/tHM implied by forcing closure to 1.0.
    scale_to_all_circuits: true

  # ---- closure reporting ---------------------------------------------------
  closure:
    green_range: [0.97, 1.03]
    amber_range: [0.93, 1.07]

# ---------------------------------------------------------------------------
# Layer 2: control-parameter recommendation for a given blend.
#
# Layer 1 (the BMO LP) picks the cheapest blend that satisfies the slag limits.
# Layer 2 takes that blend as an INPUT and solves for the control settings that
# minimise fuel cost while supplying the energy the blend demands.
#
# WHICH KNOBS THIS CAN ACTUALLY OPTIMISE.
#
# Only three of the seven appear in the energy balance at all:
#     blast temperature   - blast sensible heat
#     oxygen enrichment   - less N2 ballast to heat
#     blast volume        - both of the above, per tHM
# plus PCI when the operator releases it.
#
# Hot blast pressure and top pressure do NOT appear in a heat balance. They act
# through burden permeability and gas utilisation. They are therefore carried
# through as pass-through settings with a bounds check, NOT optimised. Steam is
# nil at this plant. Pretending to optimise any of these three would be
# fabricating a recommendation.
process_recommendation:
  enabled: true

  # Bounds are the observed operating envelope (p5-p95 over 6,515 hours),
  # widened slightly. A recommendation outside what the furnace has actually
  # demonstrated is extrapolation and is flagged as such.
  bounds:
    blast_temperature_c: [1100.0, 1250.0]
    oxygen_enrichment_pct: [2.5, 5.5]
    blast_volume_nm3_per_hr: [95000.0, 118000.0]
    pci_kg_per_thm: [110.0, 210.0]
  observed_envelope:
    blast_temperature_c: [1138.9, 1229.3]
    oxygen_enrichment_pct: [2.95, 5.00]
    blast_volume_nm3_per_hr: [99957.0, 113330.0]
    pci_kg_per_thm: [122.3, 202.3]

  # Largest change from current settings the recommendation may ask for in one
  # step. An instruction the operator cannot act on is not a recommendation.
  move_limits:
    blast_temperature_c: 30.0
    oxygen_enrichment_pct: 0.5
    blast_volume_nm3_per_hr: 4000.0
    pci_kg_per_thm: 15.0

  # PCI is released only when the operator says so ("at times PCI").
  optimise_pci_by_default: false

  # RAFT is ADVISORY, not a constraint.
  #
  # RAFTOC was calibrated against blast temp, O2 and PCI: the coefficients come
  # out textbook (intercept 1555 vs 1559 standard, blast-temp 0.810 vs 0.839),
  # but forward R2 is only 0.11 and the residual carries a seasonal bias of up
  # to +46 C in Jun-Sep that could not be attributed - it is the wrong sign for
  # blast humidity and adding H2 as a proxy did not help. So the band is
  # reported as guidance with its uncertainty, and does not block a solution.
  raft:
    # THE CALCULATION LIVES IN utils/energy_balance/raft.py, not here.
    #
    # RAFT now follows the plant's own workbook (Raft Calculation EML.xlsx) via
    # its implementation guide, reproduced to 1e-6 against the guide's cached
    # values in tests/test_raft_workbook.py. The constants 1559 / 0.839 / 4972 /
    # 6.033 / 3010 are the workbook's and are held in code beside the balance
    # they belong to, because they are meaningless split from the dry-blast
    # chain that feeds them.
    #
    # WHAT WAS REPLACED, AND WHY THE REPLACEMENT SCORES WORSE. A literature form
    # calibrated against body_raft scored forward R2 0.63; the workbook form
    # scores 0.38-0.40. That is not a reason to keep the fitted one. RAFT cannot
    # be measured - body_raft is itself a calculated tag - so a closer fit to it
    # means closer agreement with the DCS's arithmetic, not more correctness.
    # The workbook form is the plant's engineering standard and is essentially
    # UNBIASED against the DCS with no calibration at all: mean error -9.7 C
    # over 2,697 hours. See scripts/raft_formula_validation.py.
    #
    # BLAST FLOW BASIS. The guide flags this as ambiguous and requires an
    # explicit choice. Resolved from the plant's own tags: at O2/wind = 5.01%,
    # the total basis implies 4.23 enrichment points against the
    # oxygen_enrichment_pct tag's 4.20; the cold basis implies 4.01. So the
    # measured flow already includes enrichment oxygen and injected steam.
    blast_flow_basis: total
    # Used only when production is unknown, so PCI kg/tHM cannot be turned into
    # a mass flow. Plant median.
    fallback_blast_nm3_per_thm: 1206.0
    advisory_band_c: [2100.0, 2350.0]
    # Spread against body_raft on the workbook form. Not an accuracy claim about
    # RAFT itself, which has no measurement to be accurate against.
    stated_uncertainty_c: 19.0
