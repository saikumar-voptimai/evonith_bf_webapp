# Blast-furnace energy balance.
#
# CONVENTION, and everything below depends on it:
#
#   Every reductant is credited on the INPUT side at its FULL oxidation
#   potential (C -> CO2, H -> H2O). Whatever the furnace fails to extract
#   leaves at the top as unburnt CO and H2 and is booked on the OUTPUT side.
#   Closure should therefore land at 1.00, not at some lumped efficiency.
#
# A useful consequence: endothermic gasification needs no separate term. For
# H2O + C -> CO + H2 the arithmetic already carries it:
#
#     input   C at full potential                = 393.5 kJ/mol
#     output  CO unburnt 283 + H2 unburnt 242    = 525.0 kJ/mol
#     net                                        = -131.5 kJ/mol  = the endotherm
#
# So blast moisture and burden moisture that gasify must NOT also be charged a
# 7.3 MJ/kg decomposition term. That would be double counting.
#
# Measured closure on 221 days of plant data: median 1.002, across-quarter
# spread 3.2%, within-quarter CV 2.1-2.8%. See
# docs/energy_balance_calculation_procedure.md for a worked day.

energy_balance:
  enabled: true

  # ---- output side: heat consumed or carried away -------------------------
  demand:
    # Fe2O3 -> 2Fe + 3/2 O2 at +824 kJ/mol Fe2O3. The single largest term in the
    # whole balance, around 7,000 MJ/tHM. Pairs with counting carbon at its full
    # combustion potential.
    fe_reduction_mj_per_kg_fe: 7.38
    # Fe that stops at FeO in the slag was only partly reduced.
    # Fe2O3 -> FeO is 7.38 - 4.82 = 2.56.
    fe_to_feo_mj_per_kg_fe: 2.56
    # Hot metal at the plant's stated 1500 C tap temperature: solid Fe 25->1150
    # at 0.75 kJ/kg.K, fusion of pig iron 247 kJ/kg, liquid 1150->1500 at 0.82.
    hot_metal_mj_per_t: 1378.0
    # Slag enthalpy at tap. Same 1.8 MJ/kg the coke correction uses, from which
    # the shipped 22 kg coke / 100 kg slag coefficient was derived.
    slag_mj_per_kg: 1.80
    # SiO2 + 2C -> Si + 2CO, 690 kJ/mol Si.
    silicon_mj_per_kg: 24.6
    manganese_mj_per_kg: 4.8
    # Free burden moisture that EVAPORATES rather than gasifying: latent heat
    # plus sensible to top-gas temperature. Moisture that reacts with carbon is
    # already handled by the convention above - see the module docstring.
    burden_moisture_mj_per_kg: 2.70
    # Flux calcination, per kg CO2 released by LOI. Small at this plant: flux
    # runs about 4 kg/tHM, so this term is a few MJ/tHM.
    calcination_mj_per_kg_co2: 2.46

  # ---- input side ----------------------------------------------------------
  supply:
    # C + O2 -> CO2, 393.5 kJ/mol.
    carbon_full_mj_per_kg: 32.8
    # H2 + 1/2 O2 -> H2O, lower heating value. Water leaves as vapour, so LHV.
    # Per kg of hydrogen ATOMS, which equals per kg H2.
    hydrogen_lhv_mj_per_kg: 120.0
    # OFF BY DEFAULT, deliberately.
    #
    # Fuel hydrogen is physically a reductant and belongs on the input side. But
    # its magnitude (~1,000 MJ/tHM) rests entirely on an H% this plant does not
    # measure - see fuels.hydrogen_pct below. Switching it on drops measured
    # closure from 1.002 to 0.910, leaving ~500 MJ/tHM that cannot yet be
    # attributed: 10.4 kg H/tHM goes in, only 4.25 leaves as H2, and the
    # reduction work the rest performed is already carried by the iron term.
    #
    # Shipping it on would make the balance look worse without making it more
    # correct, because the error would sit in a constant nobody measured. Set
    # fuels.hydrogen_pct from the supplier's ultimate analysis, then turn this
    # on and re-check closure.
    include_fuel_hydrogen: false
    blast_cp_kj_per_nm3_k: 1.40
    reference_temperature_c: 25.0

  # ---- top gas -------------------------------------------------------------
  top_gas:
    # Volume comes from a nitrogen balance, not a correlation: N2 is inert, so
    # every Nm3 in with the blast leaves at the top.
    #     N2% blast = 100 - O2%   ;   N2% top = 100 - CO - CO2 - H2
    #     V_top     = V_blast * N2%_blast / N2%_top
    # Verified against the record: 1,622 Nm3/tHM median, calorific value
    # ~3.5 MJ/Nm3. Textbook ranges are 1,500-1,700 and 3.2-3.5.
    n2_in_air_pct: 79.2
    co_lhv_mj_per_nm3: 12.63
    h2_lhv_mj_per_nm3: 10.78
    cp_kj_per_nm3_k: 1.38
    # Guard: below this the nitrogen balance is being fed nonsense analysis and
    # the volume would explode.
    min_n2_top_pct: 30.0

  # ---- fuel properties -----------------------------------------------------
  fuels:
    # Carbon as a fraction of dry fuel.
    carbon_fraction:
      coke: 0.87
      nut_coke: 0.87
      pci: 0.75
    # Hydrogen as a percentage of dry fuel.
    #
    # NOT MEASURED AT THIS PLANT. offline_feed.fuel_chemistry carries proximate
    # analysis only (ash, FC, VM, moisture, TM) - there is no ultimate analysis
    # anywhere in the schema. Set a value here the moment the supplier's C/H/O/N/S
    # certificate is available; it scales an input term worth ~1,000 MJ/tHM.
    #
    # Until then hydrogen_pct is null and H% is estimated from VM by the
    # correlation below, which is standard for bituminous coals in the 18-22% VM
    # band. It is a correlation, not a measurement.
    hydrogen_pct:
      coke: null
      nut_coke: null
      pci: null
    hydrogen_from_vm_factor:
      coke: 0.25
      nut_coke: 0.25
      pci: 0.25

  # ---- blast moisture ------------------------------------------------------
  # Ambient humidity carried in with the blast. NOT instrumented - process_params
  # has no humidity tag - so this is a plant-supplied constant. 15 g/Nm3 is the
  # operator's figure; at ~1,175 Nm3/tHM that is 17.6 kg H2O/tHM, contributing
  # about 2.0 kg H/tHM against roughly 7 kg from PCI.
  #
  # It is credited as hydrogen ALREADY OXIDISED, so it gets no input heat. Its
  # effect appears through the extra H2 it puts in the top gas.
  blast_moisture_g_per_nm3: 15.0

  # ---- shell losses --------------------------------------------------------
  shell_loss:
    # Stave heat-load tags read in MW. x3.6 gives GJ/hr (median 16.8, matching
    # the operator's expected 15-20). The "GW.hr -> GJ" conversion of x3600 is
    # 1000x too large - check any production code that applies it.
    heatload_mw_to_gj_per_hr: 3.6
    # Sensor dropouts read 0 and spikes reach 236 MW. This window keeps ~90%.
    valid_range_mw: [2.0, 12.0]
    # Stave rows 6-10 cover bosh, belly and lower stack only. Hearth, bottom,
    # tuyere nose and upper shaft are missing, so the measured figure is scaled
    # by the ratio of total cooling-water flow to the flow through those zones.
    # Crude - it assumes equal dT across circuits - but the result (550 MJ/tHM)
    # agrees within 9% with the 597 MJ/tHM implied by forcing closure to 1.0.
    scale_to_all_circuits: true

  # ---- closure reporting ---------------------------------------------------
  closure:
    green_range: [0.97, 1.03]
    amber_range: [0.93, 1.07]

# ---------------------------------------------------------------------------
# Layer 2: control-parameter recommendation for a given blend.
#
# Layer 1 (the BMO LP) picks the cheapest blend that satisfies the slag limits.
# Layer 2 takes that blend as an INPUT and solves for the control settings that
# minimise fuel cost while supplying the energy the blend demands.
#
# WHICH KNOBS THIS CAN ACTUALLY OPTIMISE.
#
# Only three of the seven appear in the energy balance at all:
#     blast temperature   - blast sensible heat
#     oxygen enrichment   - less N2 ballast to heat
#     blast volume        - both of the above, per tHM
# plus PCI when the operator releases it.
#
# Hot blast pressure and top pressure do NOT appear in a heat balance. They act
# through burden permeability and gas utilisation. They are therefore carried
# through as pass-through settings with a bounds check, NOT optimised. Steam is
# nil at this plant. Pretending to optimise any of these three would be
# fabricating a recommendation.
process_recommendation:
  enabled: true

  # Bounds are the observed operating envelope (p5-p95 over 6,515 hours),
  # widened slightly. A recommendation outside what the furnace has actually
  # demonstrated is extrapolation and is flagged as such.
  bounds:
    blast_temperature_c: [1100.0, 1250.0]
    oxygen_enrichment_pct: [2.5, 5.5]
    blast_volume_nm3_per_hr: [95000.0, 118000.0]
    pci_kg_per_thm: [110.0, 210.0]
  observed_envelope:
    blast_temperature_c: [1138.9, 1229.3]
    oxygen_enrichment_pct: [2.95, 5.00]
    blast_volume_nm3_per_hr: [99957.0, 113330.0]
    pci_kg_per_thm: [122.3, 202.3]

  # Largest change from current settings the recommendation may ask for in one
  # step. An instruction the operator cannot act on is not a recommendation.
  move_limits:
    blast_temperature_c: 30.0
    oxygen_enrichment_pct: 0.5
    blast_volume_nm3_per_hr: 4000.0
    pci_kg_per_thm: 15.0

  # PCI is released only when the operator says so ("at times PCI").
  optimise_pci_by_default: false

  # RAFT is ADVISORY, not a constraint.
  #
  # RAFTOC was calibrated against blast temp, O2 and PCI: the coefficients come
  # out textbook (intercept 1555 vs 1559 standard, blast-temp 0.810 vs 0.839),
  # but forward R2 is only 0.11 and the residual carries a seasonal bias of up
  # to +46 C in Jun-Sep that could not be attributed - it is the wrong sign for
  # blast humidity and adding H2 as a proxy did not help. So the band is
  # reported as guidance with its uncertainty, and does not block a solution.
  raft:
    intercept: 1555.4
    per_c_blast_temp: 0.8100
    per_pct_o2: 26.511
    per_kg_pci: -2.2229
    advisory_band_c: [2100.0, 2350.0]
    stated_uncertainty_c: 46.0
