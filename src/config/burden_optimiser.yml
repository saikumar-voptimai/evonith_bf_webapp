# Burden & Fuel Optimiser page (custom_pages/11_Burden_Fuel_Optimiser.py) - epic #260.
#
# The engine (src/utils/burden_engine) takes its physics from the two-zone (Rist) model in src/utils/coke_energy and its
# rules of thumb, plausibility bands and default limits from src/config/facts_register.json. This file only sets where
# the page's inputs come from and the defaults the operator starts from.

burden_optimiser:
  yard:
    # Raw-material chemistry: average of the lab samples over this many days (same provider as the Blend Mix Optimiser).
    chemistry_mode: avg
    chemistry_window_days: 30
    # Stock caps each material's t/day: stock / horizon. 1 day = the Blend Mix Optimiser's rule (t/day <= stock).
    stock_horizon_days: 1.0
    # Materials whose chemistry fell back to bmo_ore_mapping.yml defaults are left out unless the operator adds them.
    exclude_fallback_chemistry: true
    # Burden-resistance rule tags (fact register FLOW-03, FLOW-04).
    k_rules:
      gomti_clo: gomti
      lloyds_oversize_clo: oversize

  prices:
    # Price basis (DATA-14). Ferrous and flux: plant prices of 23 Oct 2026 (NMDC ROM 10,323, Lloyds CLO 8,877, NMDC
    # Donimalai 6,141, Geomin 4,204, sinter 8,784, Lloyds pellet 10,515; limestone 2,369, dolomite 1,196, quartzite
    # 1,792 Rs/t); materials without a given price keep the operator's saved value. Fuels: BF-2 October-26 cost sheet,
    # FTD Costing 22 Oct 2026. The same prices are the defaults in bmo_operator_inputs.yml (live yard); the reference
    # yard (offline) takes them from here.
    source: "Plant prices 23 Oct 2026; fuels: BF-2 cost sheet FTD Costing 22 Oct 2026"
    materials:
      sinter_sp_02: 8784
      geomin_clo: 4204
      lloyds_clo: 8877
      nmdc_donimalai: 6141
      gomti_clo: 5349
      jrs_ventures: 6831
      jayaswal_neco: 6650
      titani_ferrous_clo: 4939
      acore_ind_pvt_ltd: 8473
      nmdc_rom: 10323
      lloyds_oversize_clo: 6162
      bacheli_fines_over_size: 10000
      lloyds_pellet: 10515
      sarda_pellet: 9650
    fluxes:
      quartz: 1792
      limestone: 2369
      dolomite: 1196
    fuel:
      coke_price: 31960
      nut_price: 26292
      pci_price: 21168
    # Granulated slag sale price, Rs/t (ASM-20; plant, 23 Oct 2026). The optimiser's objective is ore + flux + coke -
    # slag credit. The operator's saved value (fuel_ash_editor -> slag) takes precedence.
    slag_price_rs_per_t: 457.85

  charging:
    # Operator figure (Oct 2026): 26.46 t non-coke per charge, at most 6.5 charges/h (FLOW-12). The Blend Mix
    # Optimiser's saved UAT value is 6.35/h; the page shows both and uses the one the operator picks.
    charge_t: 26.46
    charges_per_h: 6.5

  thermal:
    # Client basis (ASM-08). PCI and nut coke are fixed inputs; HMT and Si are band-checked (BAND-02/03).
    HMT: 1470.0
    hm_Si: 0.38
    pci_kg_thm: 190.0
    nut_kg_thm: 70.0

  production:
    default_target_t_day: 2270.0
    frontier_lo_t_h: 84.0
    frontier_step_t_h: 1.0
    o2_levels: 9               # oxygen grid from today's enrichment up to the enrichment limit

  model_check:
    # The model against the furnace, shown before the optimisation: burnt coke per shift against the energy-balance
    # (the optimiser's model) and oxygen-balance predictions from the Coke Energy pipeline. "On track" when, over the
    # stable shifts of the period, the energy model's bias is within ok_bias_kgthm and its SD within ok_sd_kgthm
    # (~1.5 x the validated shift SD of 7.7 kg/tHM, register DATA-06).
    default_days: 14
    ok_bias_kgthm: 8.0
    ok_sd_kgthm: 12.0
    min_shifts: 6
    stale_after_days: 2    # warn when the latest scored shift is older than this
    # Burden descent time, stockline to tuyeres: the lag at which the thermal state answers a fuel change, 6-7 h
    # (docs/bmo_fuel_slag_si_findings.md). Used in the burnt-against-charged-coke tab's text only.
    descent_time_h: 6.5

  calibration:
    # Two-zone calibration (shaft efficiency, lower/upper-zone losses, r_H): medians over the stable shifts of the
    # previous N days from the Coke Energy pipeline; the shipped Jul-Oct 2026 calibration when there are too few.
    window_days: 14
    min_shifts: 10
    fallback_path: src/assets/burden_engine/cal_2z_jul_oct_2026.json
    # Operating regime (today's controls): medians of the 10-min data over the previous N days.
    regime_window_days: 14

  # Blast moisture (DATA-04: not measured; no steam added): the default is the month's typical ambient value from the
  # Coke Energy model (utils.coke_energy.bf_thermo.HUMIDITY_G_NM3), so both pages use one table. The operator can
  # override it on the page.
